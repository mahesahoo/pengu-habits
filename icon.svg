  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- flippers -->
  <ellipse cx="118" cy="330" rx="30" ry="78" fill="#2f3650" transform="rotate(18 118 330)"/>
  <ellipse cx="394" cy="330" rx="30" ry="78" fill="#2f3650" transform="rotate(-18 394 330)"/>

  <!-- body -->
