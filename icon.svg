  <!-- belly -->
  <ellipse cx="256" cy="336" rx="96" ry="118" fill="#ffffff"/>

  <!-- eyes -->
  <circle cx="216" cy="248" r="17" fill="#ffffff"/>
  <circle cx="296" cy="248" r="17" fill="#ffffff"/>
  <circle cx="219" cy="247" r="8" fill="#1c2030"/>
  <circle cx="299" cy="247" r="8" fill="#1c2030"/>
  <circle cx="222" cy="244" r="3" fill="#ffffff"/>
  <circle cx="302" cy="244" r="3" fill="#ffffff"/>

  <!-- beak -->
  <ellipse cx="256" cy="284" rx="22" ry="14" fill="#ff9a6b"/>
  <path d="M256 270 L272 284 L256 298 L240 284 Z" fill="#f98a58"/>

  <!-- blush -->
